name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, curl, mbstring, xml
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Code style
        run: composer cs

      - name: PHPStan
        run: composer phpstan

      - name: Tests
        run: composer test
